<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader - تحميل الفيديوهات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background: #0f0f13; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: #1a1a24; border-radius: 16px; padding: 30px 25px; width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 22px; margin-bottom: 8px; }
        .header p { color: #888; font-size: 13px; }
        .input-section { display: flex; flex-direction: column; gap: 12px; }
        .input-section input { width: 100%; padding: 14px 16px; background: #0f0f13; border: 2px solid #333; border-radius: 10px; color: #fff; font-size: 14px; }
        .input-section input:focus { outline: none; border-color: #e1306c; }
        .input-section button { padding: 14px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .loading-section { text-align: center; margin-top: 20px; display: none; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: #e1306c; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .result-section { text-align: center; margin-top: 20px; display: none; }
        .success-text { color: #4ade80; font-size: 14px; margin-bottom: 15px; }
        .save-btn { width: 100%; padding: 15px; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* أزرار التصفح */
        .browse-section { margin-top: 25px; padding-top: 20px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .browse-btn { display: block; width: 100%; padding: 14px; color: #fff; text-decoration: none; border-radius: 10px; font-size: 16px; font-weight: bold; text-align: center; transition: 0.3s; }
        
        .btn-insta { background: #0095f6; }
        .btn-insta:hover { background: #0077cc; }
        
        .btn-tiktok { background: #000; border: 1px solid #333; }
        .btn-tiktok:hover { border-color: #00f2fe; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📥 محمل الفيديوهات</h1>
            <p>حمل فيديوهات إنستغرام وتيك توك بجودة عالية</p>
        </div>

        <div class="input-section" id="inputSection">
            <input type="text" id="videoUrl" placeholder="الصق رابط الفيديو هنا..." dir="ltr">
            <button id="downloadBtn">تحميل الآن</button>
        </div>

        <div class="loading-section" id="loadingSection">
            <div class="spinner"></div>
            <p id="loadingText">جاري تحليل الرابط...</p>
        </div>

        <div class="result-section" id="resultSection">
            <p class="success-text">تم العثور على الفيديو بنجاح!</p>
            <button class="save-btn" id="saveBtn">تحميل الفيديو الآن ⬇️</button>
            
            <div style="margin-top: 15px;">
                <a href="login.html" style="color: #0095f6; font-size: 13px; text-decoration: none;">تسجيل الدخول لحفظ الفيديو في حسابك</a>
            </div>
        </div>

        <!-- أزرار التصفح -->
        <div class="browse-section">
            <a href="insta.html" class="browse-btn btn-insta">🔍 تصفح حسابات إنستجرام</a>
            <a href="tiktok.html" class="browse-btn btn-tiktok">🎵 تصفح حسابات تيك توك</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
